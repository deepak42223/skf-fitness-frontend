<section id="contact">
  <div class="container">

    <!-- Section Header -->
    <div class="contact-header">
      <h2 class="contact-title">
        Get In <span class="contact-title-blue">Touch</span>.
      </h2>
    </div>

    <!-- Contact Grid: Form Left, Map Right -->
    <div class="contact-main-grid">

      <!-- LEFT: Contact Form -->
      <div class="contact-form-section">
        <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">

          <!-- Full Name Field -->
          <div class="form-group">
            <label class="form-label">FULL NAME</label>
            <input
              type="text"
              class="form-input"
              [(ngModel)]="form.name"
              name="name"
              placeholder="Your full name"
              required />
          </div>

          <!-- Email & Phone Row -->
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label">EMAIL ADDRESS</label>
              <input
                type="email"
                class="form-input"
                [(ngModel)]="form.email"
                name="email"
                placeholder="you@example.com"
                required />
            </div>
            <div class="form-group">
              <label class="form-label">PHONE NUMBER</label>
              <input
                type="tel"
                class="form-input"
                [(ngModel)]="form.phone"
                name="phone"
                placeholder="+91"
                required />
            </div>
          </div>

          <!-- Message Field -->
          <div class="form-group">
            <label class="form-label">MESSAGE</label>
            <textarea
              class="form-textarea"
              [(ngModel)]="form.message"
              name="message"
              placeholder="Tell us about your goals"
              rows="5"
              required></textarea>
          </div>

          <!-- Error/Success Messages -->
          @if (isError()) {
            <div class="form-feedback error">{{ errorMsg() }}</div>
          }
          @if (isSuccess()) {
            <div class="form-feedback success">✓ Message sent successfully!</div>
          }

          <!-- Submit Button -->
          <button
            type="submit"
            class="form-submit-btn"
            [disabled]="isLoading() || !contactForm.valid">
            {{ isLoading() ? 'SENDING...' : 'SEND MESSAGE' }}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>

        </form>
      </div>

      <!-- RIGHT: Map Card -->
      <div class="contact-map-section">
        <div class="map-card">
          <!-- Map Placeholder -->
          <div class="map-placeholder">
            <div class="map-marker">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="#2563EB">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
            </div>
            <div class="map-location-name">SKF Fitness</div>
            <div class="map-location-address">Hyderabad, Telangana</div>
          </div>

          <!-- Contact Info Cards -->
          <div class="contact-info-cards">
            
            <div class="info-card">
              <div class="info-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
              <div class="info-card-content">
                <p class="info-card-label">ADDRESS</p>
                <p class="info-card-value">Hyderabad Telangana</p>
              </div>
            </div>

            <div class="info-card">
              <div class="info-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </div>
              <div class="info-card-content">
                <p class="info-card-label">PHONE</p>
                <p class="info-card-value">+91 883 773 5911</p>
              </div>
            </div>

            <div class="info-card">
              <div class="info-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </div>
              <div class="info-card-content">
                <p class="info-card-label">EMAIL</p>
                <p class="info-card-value">info@skffitness.com</p>
              </div>
            </div>

            <div class="info-card">
              <div class="info-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="info-card-content">
                <p class="info-card-label">HOURS</p>
                <p class="info-card-value">Mon-Sat: 5 AM-10 PM</p>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>

  </div>
</section>
