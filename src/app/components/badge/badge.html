<div class="badge-wrapper" [class.hero-badge-anim]="animated">
  <span class="badge-content">{{ title }}</span>
  
  <!-- Animated Rectangle Corners (only shown when animated is true) -->
  <div class="rect-container" *ngIf="animated">
    <div class="rectangle one"></div>
    <div class="rectangle two"></div>
    <div class="rectangle three"></div>
    <div class="rectangle four"></div>
  </div>
</div>
