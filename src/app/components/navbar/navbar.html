<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="container">
    <div class="nav-content">

      <!-- Logo: SKF.FITNESS -->
      <a class="nav-logo" routerLink="/" style="cursor:pointer">
        <img src="skf-logo.jpg" alt="SKF FITNESS" class="nav-logo-img">
      </a>

      <!-- Desktop nav links -->
      <ul class="nav-links">
        <li><a class="nav-link" (click)="navigate('workout-format')" [class.active]="isActive('workout-format')" style="cursor:pointer">Programs</a></li>
        <li><a class="nav-link" routerLink="/trainers" routerLinkActive="active">Trainers</a></li>
        <li><a class="nav-link" (click)="navigate('pricing')" [class.active]="isActive('pricing')" style="cursor:pointer">Membership</a></li>
        <li><a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a></li>
      </ul>

      <!-- Right: Join Now Button -->
      <div class="nav-right">
        @if (isLoggedIn()) {
          <button class="nav-cta" (click)="goToProfile()">
            👤 {{ userName() }}
          </button>
        } @else {
          <button class="nav-cta" (click)="openAuthModal()">
            Join now
          </button>
        }
        <button class="mobile-menu-btn" (click)="toggleMenu()" [class.active]="menuOpen()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    <ul class="mobile-nav-links">
      <li><a routerLink="/" (click)="closeMenu()" style="cursor:pointer">Home</a></li>
      <li><a (click)="navigate('workout-format'); closeMenu()" style="cursor:pointer">Programs</a></li>
      <li><a routerLink="/trainers" (click)="closeMenu()">Trainers</a></li>
      <li><a (click)="navigate('pricing'); closeMenu()" style="cursor:pointer">Membership</a></li>
      <li><a routerLink="/contact" (click)="closeMenu()">Contact</a></li>
      @if (!isLoggedIn()) {
        <li><a (click)="openAuthModal(); closeMenu()" style="cursor:pointer;color:#E23B2E;font-weight:700">Join now →</a></li>
      }
    </ul>
  </div>
</nav>
