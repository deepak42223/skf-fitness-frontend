<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="container">
    <div class="nav-content">

      <!-- Logo -->
      <a class="nav-logo" routerLink="/" style="cursor:pointer">
        <img src="skf-logo-new.jpg" alt="SKF Fitness Studio" class="logo-img" width="46" height="46" />
      </a>

      <!-- Center Navigation Links -->
      <ul class="nav-links">
        <li><a class="nav-link" routerLink="/"          routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">HOME</a></li>
        <li><a class="nav-link" routerLink="/about"     routerLinkActive="active">ABOUT US</a></li>
        <li><a class="nav-link" routerLink="/services"  routerLinkActive="active">SERVICES</a></li>
        <li><a class="nav-link" routerLink="/programs"  routerLinkActive="active">PROGRAMS</a></li>
        <li><a class="nav-link" routerLink="/trainers"  routerLinkActive="active">TRAINERS</a></li>
        <li><a class="nav-link" (click)="navigate('pricing')" style="cursor:pointer" [class.active]="isActive('pricing')">PRICING</a></li>
        <li><a class="nav-link" routerLink="/contact"   routerLinkActive="active">CONTACT</a></li>
      </ul>

      <!-- Right Controls -->
      <div class="nav-right">
        @if (isLoggedIn()) {
          <button class="nav-cta" (click)="goToProfile()">
            👤 {{ userName() }}
          </button>
        } @else {
          <button class="nav-cta" (click)="openAuthModal()">
            JOIN NOW <span class="cta-arrow">➤</span>
          </button>
        }
        <button class="mobile-menu-btn" (click)="toggleMenu()" [class.active]="menuOpen()">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    <ul class="mobile-nav-links">
      <li><a routerLink="/"         (click)="closeMenu()">HOME</a></li>
      <li><a routerLink="/about"    (click)="closeMenu()">ABOUT US</a></li>
      <li><a routerLink="/services" (click)="closeMenu()">SERVICES</a></li>
      <li><a routerLink="/programs" (click)="closeMenu()">PROGRAMS</a></li>
      <li><a routerLink="/trainers" (click)="closeMenu()">TRAINERS</a></li>
      <li><a (click)="navigate('pricing'); closeMenu()" style="cursor:pointer">PRICING</a></li>
      <li><a routerLink="/contact"  (click)="closeMenu()">CONTACT</a></li>
      @if (!isLoggedIn()) {
        <li><a (click)="openAuthModal(); closeMenu()" style="cursor:pointer;color:#3498DB">JOIN NOW ➤</a></li>
      }
    </ul>
  </div>
</nav>
