<section class="fz-section" id="zones">
  <div class="container">

    <!-- Header -->
    <div class="fz-header reveal">
      <div class="fz-eyebrow">
        <span class="fz-eyebrow-bar"></span>
        <span>SANCTUARY OF POWER</span>
      </div>
      <h2 class="fz-title">DISCIPLINES & FACILITY ZONES</h2>
    </div>

    <!-- 2×2 Grid -->
    <div class="fz-grid">
      @for (zone of zones; track zone.name; let i = $index) {
        <div class="fz-card reveal" [style.transition-delay]="(i * 0.1) + 's'">
          <!-- Image -->
          <div class="fz-img-wrap">
            <img [src]="zone.image" [alt]="zone.name" class="fz-img" loading="lazy" />
            <div class="fz-overlay"></div>
            <!-- Category badge -->
            <span class="fz-badge">{{ zone.category }}</span>
          </div>
          <!-- Content -->
          <div class="fz-content">
            <h3 class="fz-name">{{ zone.name }}</h3>
            <p class="fz-desc">{{ zone.description }}</p>
          </div>
        </div>
      }
    </div>

  </div>
</section>
