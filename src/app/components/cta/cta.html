<section class="cta-section" id="cta">
  <div class="container">
    <div class="cta-box">

      <video class="cta-video" autoplay muted loop playsinline preload="auto">
        <source src="15079739_1920_1080_30fps.mp4" type="video/mp4">
      </video>
      <div class="cta-overlay"></div>

      <div class="cta-content">
        <div class="cta-tag">Join SKF Fitness Today</div>
        <h2 class="cta-headline">
          <span class="cta-headline-line">Start Your</span>
          <app-animated-headline
            [words]="['TRANSFORMATION', 'JOURNEY', 'SUCCESS STORY', 'NEW CHAPTER']"
            effect="clip"
            [animationDelay]="2700"
            wrapperClass="cta-animated-wrapper">
          </app-animated-headline>
        </h2>
        <p>Take the first step toward your transformation. Our certified coaches are ready to help you build a personalized plan and achieve real results.</p>
        <a href="#pricing" class="btn-white">View Membership Plans &rarr;</a>
      </div>

    </div>
  </div>
</section>
