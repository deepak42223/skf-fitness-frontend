<div class="loader-wrap">

  <!-- Logo letters split for stagger animation -->
  <div class="loader-logo">
    <span class="loader-letter">S</span>
    <span class="loader-letter">K</span>
    <span class="loader-letter">F</span>
    <span class="loader-spacer">&nbsp;</span>
    <span class="loader-letter loader-small">FITNESS</span>
  </div>

  <!-- Tagline -->
  <p class="loader-tagline">HYDERABAD'S PREMIER GYM</p>

  <!-- Progress bar -->
  <div class="loader-bar">
    <div class="loader-bar-fill"></div>
  </div>

  <!-- Counter -->
  <span class="loader-counter">{{ counter }}</span>

</div>
