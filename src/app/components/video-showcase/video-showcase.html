<div class="video-showcase-wrapper">
  <div class="video-showcase" [class.unmuted]="!isMuted">
    <video
      #videoPlayer
      class="video-player"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >
      <source src="skf-hero.mp4" type="video/mp4" />
      <source src="skf-hero.mp4" type="video/quicktime" />
      Your browser does not support the video tag.
    </video>

    <!-- Sound toggle overlay -->
    <button
      #soundToggle
      class="sound-toggle"
      [class.hidden]="!isMuted"
      (click)="toggleSound()"
      [attr.aria-label]="isMuted ? 'Unmute video' : 'Mute video'"
    >
      <div class="play-button">
        <!-- Spinning ring -->
        <div class="spinning-ring"></div>
        
        <!-- Play icon -->
        <svg
          width="36"
          height="36"
          class="play-icon"
          fill="none"
          viewBox="0 0 36 36"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M20.9108 9.50547C23.3603 10.897 25.2851 11.9905 26.6564 12.9922C28.037 14.0008 29.0582 15.0549 29.4239 16.4448C29.6921 17.4639 29.6921 18.5361 29.4239 19.5552C29.0582 20.9451 28.037 21.9991 26.6564 23.0077C25.2851 24.0094 23.3603 25.1029 20.9109 26.4945C18.5448 27.8386 16.5495 28.9722 15.0348 29.6166C13.508 30.2659 12.1159 30.5952 10.763 30.2118C9.76878 29.9299 8.86412 29.3952 8.13534 28.6599C7.14629 27.6621 6.74927 26.2828 6.56144 24.6231C6.37497 22.9753 6.37499 20.8185 6.375 18.0751V17.9248C6.37499 15.1815 6.37497 13.0246 6.56144 11.3769C6.74927 9.71712 7.14629 8.33789 8.13534 7.34C8.86412 6.60473 9.76878 6.06996 10.763 5.78822C12.1159 5.40485 13.508 5.73401 15.0348 6.38345C16.5495 7.02771 18.5448 8.16123 20.9108 9.50547Z"
            fill="url(#vs_gradient)"
          />
          <defs>
            <linearGradient
              id="vs_gradient"
              x1="18"
              y1="30.3751"
              x2="18"
              y2="5.62488"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#2563EB" />
              <stop offset="1" stop-color="#60a5fa" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </button>

    <!-- Mute button (appears after unmuting) -->
    <button
      *ngIf="!isMuted"
      class="mute-button"
      (click)="toggleSound()"
      aria-label="Mute video"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.07 4.93L15.54 8.46" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M15.54 15.54L19.07 19.07" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
