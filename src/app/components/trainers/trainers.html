<section id="trainers">
  <div class="container">
    <div class="section-header">
      <div class="section-badge gold">Expert Team</div>
      <h2 class="section-title">Meet Your Trainers</h2>
      <p class="section-subtitle">Certified professionals dedicated to helping you achieve your fitness goals</p>
    </div>

    <div class="trainers-grid">
      @for (trainer of trainers; track trainer.id) {
        <div class="trainer-card reveal">
          <div class="trainer-image">
            <img [src]="trainer.image" [alt]="trainer.name" loading="lazy">
            <div class="trainer-overlay">
              <div class="trainer-socials">
                @if (trainer.instagram) {
                  <a [href]="trainer.instagram" class="social-link" target="_blank" aria-label="Instagram">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="2" width="20" height="20" rx="5"/>
                      <circle cx="12" cy="12" r="4"/>
                      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
                    </svg>
                  </a>
                }
              </div>
            </div>
          </div>
          <div class="trainer-info">
            <h3 class="trainer-name">{{ trainer.name }}</h3>
            <p class="trainer-specialty">{{ trainer.specialty }}</p>
            <div class="trainer-stats">
              <span class="stat-item">{{ trainer.experience }} exp</span>
              <span class="stat-divider">•</span>
              <span class="stat-item">{{ trainer.certifications }}</span>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
