<section class="approach" id="approach">
  <div class="container">
    <div class="approach-grid">

      <!-- LEFT: Image -->
      <div class="approach-image-wrap">
        <img
          src="edgar-chaparro-sHfo3WOgGTU-unsplash.jpg"
          alt="SKF Fitness Training"
          class="approach-img"
          loading="lazy" />
      </div>

      <!-- RIGHT: Content (unchanged) -->
      <div class="approach-content">

        <!-- Icon Badge -->
        <div class="approach-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>

        <!-- Eyebrow -->
        <p class="approach-eyebrow">Our Approach</p>

        <!-- Headline -->
        <h2 class="approach-headline">
          Not just a place to train.<br>
          A practice for <span class="approach-highlight">life</span>.
        </h2>

        <!-- Description -->
        <p class="approach-description">
          At SKF Fitness, we don't chase quick fixes. Through considered movement, expert guidance and consistent support, we help you feel capable in your body — in the gym and beyond.
        </p>

        <!-- CTA Button -->
        <button class="approach-btn" (click)="openPhilosophy()">
          Our Philosophy
        </button>

      </div>
    </div>
  </div>
</section>
