<section id="programs">
  <div class="container">

    <!-- Section Header -->
    <div class="programs-header">
      <p class="programs-eyebrow">OUR PROGRAMS</p>
      <h2 class="programs-title">
        <span class="title-line"></span>
        TRAIN FOR <span class="title-blue">YOUR GOALS</span>
        <span class="title-line"></span>
      </h2>
    </div>

    <!-- 4-Card Horizontal Strip -->
    <div class="programs-grid">
      @for (program of programs; track program.id; let i = $index) {
        <div class="program-card" [style.animation-delay]="(i * 0.12) + 's'">

          <!-- Full-bleed image -->
          <div class="program-img-wrap">
            <img [src]="program.image" [alt]="program.name" class="program-img" loading="lazy" />
            <div class="program-img-overlay"></div>
          </div>

          <!-- Bottom label bar -->
          <div class="program-label">
            <div class="program-icon-badge">
              <svg class="prog-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                @if (program.id === 'hiit') {
                  <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                } @else if (program.id === 'strength') {
                  <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5l2-2 2 2M18 8.5l2-2 2 2M2 15.5l2 2 2-2M18 15.5l2 2 2-2"/>
                } @else if (program.id === 'yoga') {
                  <circle cx="12" cy="5" r="2"/><path d="M12 7v6M9 10c0 0-2 1-3 3M15 10c0 0 2 1 3 3M9 20l3-3 3 3"/>
                } @else {
                  <path d="M14.5 22H18a2 2 0 0 0 2-2v-7.5M2 2l20 20M9.5 2H6a2 2 0 0 0-2 2v7.5M15 9l-6 6M9 9l6 6"/>
                }
              </svg>
            </div>
            <span class="program-name">{{ program.name | uppercase }}</span>
          </div>

        </div>
      }
    </div>

  </div>
</section>
