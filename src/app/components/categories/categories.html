<section id="programs">

  <!-- Three.js particle canvas behind the section -->
  <canvas #progCanvas class="prog-three-canvas"></canvas>

  <div class="container">

    <!-- Section Header -->
    <div class="programs-header">
      <div class="programs-header-left">
        <h2 class="programs-title">
          Find your way<br>to move.
        </h2>
      </div>
      <div class="programs-header-right">
        <p class="programs-description">
          Different goals need different paths. Every Form program is led by coaches who see the whole person, not just the workout.
        </p>
      </div>
    </div>

    <!-- Cards: 4 columns -->
    <div class="programs-grid">
      @for (program of programs; track program.id; let i = $index) {
        <div class="prog-card reveal" [class.loading-skeleton]="loading()" [style.transition-delay]="(i * 0.1) + 's'">
          <div class="prog-image-wrap">
            <img [src]="program.image" [alt]="program.name" class="prog-image" [class.skeleton-image]="loading()" loading="lazy" />
            <div class="prog-overlay"></div>
            
            <!-- Number badge -->
            <div class="prog-number">0{{ i + 1 }}</div>
            
            <!-- Content at bottom -->
            <div class="prog-content">
              <h3 class="prog-name" [class.skeleton-text]="loading()">{{ program.name }}</h3>
              <p class="prog-description">{{ getDescription(program.id) }}</p>
              <a href="#membership" class="prog-explore">
                EXPLORE
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
