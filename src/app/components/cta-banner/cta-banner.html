<section class="cta-banner" id="cta-banner">
  
  <!-- Background image -->
  <div class="cta-bg-image">
    <img src="hero-bg.png" alt="SKF Fitness Gym" loading="lazy" />
    <div class="cta-bg-overlay"></div>
  </div>

  <div class="container">
    <div class="cta-banner-content">
      
      <!-- Badge -->
      <div class="cta-badge">
        <span class="badge-dot"></span>
        SKF Fitness — Hyderabad
      </div>

      <!-- Headline -->
      <h2 class="cta-headline">
        Train Smarter, Not <span class="cta-highlight">Harder</span>.
      </h2>

      <!-- Description -->
      <p class="cta-description">
        Coaching, intelligent programming and community—everything you need to build strength that lasts.
      </p>

      <!-- CTA Button -->
      <button class="cta-btn" (click)="openAuthModal()">
        Join Now →
      </button>

    </div>
  </div>

</section>
