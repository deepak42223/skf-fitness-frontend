<section class="hero" id="home">

  <!-- ── Background Video ── -->
  <div class="hero-bg">
    <video #videoPlayer autoplay muted loop playsinline preload="auto"
      class="hero-video" (ended)="nextVideo()">
      <source [src]="getCurrentVideoSrc()" type="video/mp4">
    </video>
    <div class="hero-video-overlay"></div>
    <canvas #ribbonCanvas class="ribbon-canvas"></canvas>
    <div class="hero-bg-overlay"></div>
  </div>

  <!-- ── Hero Content ── -->
  <div class="hero-content">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-left">

          <!-- Badge -->
          <span class="hero-eyebrow">
            <svg width="6" height="6" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#12E0C4"/></svg>
            HYDERABAD'S PREMIER GYM
          </span>

          <!-- Headline -->
          <h1 class="hero-headline">
            <span class="headline-line">TRAIN HARDER,</span>
            <span class="headline-line headline-teal">GET STRONGER</span>
          </h1>

          <!-- Supporting description -->
          <p class="hero-para">
            Expert coaching, premium equipment, and personalized programs —<br class="desktop-break">
            everything you need to reach your peak performance.
          </p>

          <!-- CTA Buttons -->
          <div class="hero-actions">
            <a class="btn-neon-render" (click)="openAuthModal()" style="cursor:pointer">
              Join Now
            </a>
            <a href="#services" class="btn-text-link">
              Explore Programs
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="hero-scroll" aria-hidden="true">
    <div class="hero-scroll-line"></div>
  </div>

</section>
