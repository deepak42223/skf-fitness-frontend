<section class="hero" id="home">
  
  <!-- 3D Carousel Background -->
  <div class="hero-bg">
    <div class="hero-3d-carousel">
      <div class="carousel-container">
        <img src="innamykytas-ai-generated-8563109_1920.jpg" alt="SKF Fitness" class="carousel-slide" />
        <img src="micheal0424-weights-3483560_1920.jpg" alt="SKF Fitness" class="carousel-slide" />
        <img src="moveprivatefitness-woman-6888634_1920.jpg" alt="SKF Fitness" class="carousel-slide" />
        <img src="tomcam-dumbbells-5013984_1920.jpg" alt="SKF Fitness" class="carousel-slide" />
      </div>
    </div>
    <div class="hero-overlay"></div>
  </div>

  <!-- Main Content -->
  <div class="hero-content">
    <div class="hero-container">
      
      <!-- Centered Content -->
      <div class="hero-center">
        
        <!-- Eyebrow Text -->
        <p class="hero-eyebrow">SKF Fitness, Hyderabad</p>
        
        <!-- Main Headline -->
        <h1 class="hero-headline">
          Built for strength.<br>
          Designed for you.
        </h1>
        
        <!-- Description -->
        <p class="hero-description">
          Expert coaching, science-backed programs, and a training floor built for serious results.
        </p>
        
        <!-- CTA Buttons -->
        <div class="hero-cta">
          <button class="btn-primary" (click)="openAuthModal()">
            Start Your Journey
          </button>
          <a routerLink="/programs" class="btn-secondary">
            Explore Programs
          </a>
        </div>
        
      </div>

    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="hero-scroll">
    <span>Explore</span>
    <svg width="12" height="24" viewBox="0 0 12 24" fill="none">
      <path d="M6 4V20M6 20L2 16M6 20L10 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

</section>
