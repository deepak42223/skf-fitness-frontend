<section id="testimonials">
  <div class="container">
    <div class="section-header">
      <div class="section-badge">MEMBER STORIES</div>
    </div>

    <div class="testimonials-grid">
      <div class="testimonial-card reveal visible" [class.fading]="isFading">
        <div class="testimonial-content">
          <div class="rating">
            @for (star of [1,2,3,4,5]; track star) {
              <span class="star">★</span>
            }
          </div>
          <p class="testimonial-text">"{{ currentTestimonial.text }}"</p>
        </div>
        <div class="testimonial-author">
          <div class="author-image">
            <img [src]="currentTestimonial.image" [alt]="currentTestimonial.name" loading="lazy">
          </div>
          <div class="author-info">
            <h4 class="author-name">{{ currentTestimonial.name }}</h4>
            <p class="author-detail">{{ currentTestimonial.achievement }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Trust Badge -->
    <div class="testimonial-trust-badge">★ 4.9/5 from 500+ members</div>

    <div class="testimonial-navigation">
      <button class="nav-arrow" (click)="previousTestimonial()">←</button>
      <div class="nav-dots">
        @for (testimonial of testimonials; track testimonial.id; let i = $index) {
          <span 
            class="nav-dot" 
            [class.active]="i === currentIndex"
            (click)="goToTestimonial(i)">
          </span>
        }
      </div>
      <button class="nav-arrow" (click)="nextTestimonial()">→</button>
    </div>

  </div>
</section>
